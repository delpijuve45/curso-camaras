<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso de Cámaras y Alarmas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f4;
        }

        header {
            background: #0a3d62;
            color: white;
            padding: 20px;
            text-align: center;
        }

        h2 {
            color: #0a3d62;
            text-align: center;
            margin-top: 40px;
        }

        .contenedor {
            width: 90%;
            max-width: 1100px;
            margin: auto;
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .galeria img {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        .modulo {
            background: white;
            padding: 20px;
            margin-top: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        iframe {
            width: 100%;
            height: 315px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>Curso Profesional de Instalación de Cámaras y Alarmas</h1>
</header>

<div class="contenedor">

    <h2>Video de Presentación</h2>
    <iframe src="https://www.youtube.com/embed/8ZgZP6FQ7wE" allowfullscreen></iframe>

    <h2>Galería de Imágenes</h2>
    <div class="galeria">
        <img src="img/81JPUk1gNlL.jpg" alt="Imagen 1">
        <img src="img/alarmas-intrusion-blog-seguridad-electronica-sh-ingenieria-deteccion-control-incendio-equipos-tienda-online-bogota-colombia.jpg" alt="Imagen 2">
        <img src="img/cableqdo-estructurado-03.jpg" alt="Imagen 3">
        <img src="img/hikvision-ids-7208hthi-m2s-2tb-5c6f520b-a4a9__13318.jpg" alt="Imagen 4">
        <img src="img/rk2236bkf.main.jpg" alt="Imagen 5">
    </div>

    <div class="modulo">
        <h2>Módulo 1: DVR y NVR</h2>
        <img src="img/hikvision-ids-7208hthi-m2s-2tb-5c6f520b-a4a9__13318.jpg" alt="DVR" style="width: 100%; margin-top: 20px;">
    </div>

    <div class="modulo">
        <h2>Módulo 2: Cableado y Redes</h2>
        <img src="img/cableqdo-estructurado-03.jpg" alt="Rack" style="width: 100%; margin-top: 20px;">
    </div>

</div>

</body>
</html>
